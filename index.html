<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>图灵机谜题 · Turing Machine Puzzle</title>
<meta name="description" content="写几条规则，让机器替你解题。Logic puzzles on a paper tape.">
<style>
  :root { --bg: #f4f3f0; --card: #ffffff; --ink: #1d2024; --soft: #4a5058; --line: #e2e0db; --accent: #c7851f; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #17191c; --card: #212428; --ink: #eceae6; --soft: #aab0b6; --line: #33373c; --accent: #e3a33c; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 17px/1.7 -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", "Segoe UI", sans-serif; }
  main { max-width: 680px; margin: 0 auto; padding: 56px 16px 64px; text-align: center; }
  .tape { display: inline-flex; gap: 6px; margin-bottom: 28px; }
  .tape span { width: 44px; height: 56px; border-radius: 8px; background: var(--card); border: 1px solid var(--line);
               display: grid; place-items: center; font-size: 28px; font-weight: 800; }
  .tape span.head { border: 2px solid var(--accent); }
  h1 { font-size: 30px; line-height: 1.3; margin: 0; }
  .en { font-size: 20px; color: var(--soft); margin: 4px 0 20px; }
  p { margin: 6px 0; color: var(--soft); }
  nav { margin-top: 32px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  nav a { display: inline-block; padding: 12px 22px; border-radius: 12px; background: var(--card); border: 1px solid var(--line);
          color: var(--ink); text-decoration: none; font-weight: 600; }
  nav a:hover { border-color: var(--accent); }
</style>
</head>
<body>
<main>
  <div class="tape" aria-hidden="true"><span class="head">1</span><span>0</span><span>1</span></div>
  <h1>图灵机谜题</h1>
  <div class="en">Turing Machine Puzzle</div>
  <p>写几条规则，让机器替你解题。45 道谜题，每天还有一道新题。</p>
  <p>Write a few rules and let the machine solve the puzzle. 45 puzzles, plus a new one every day.</p>
  <nav>
    <a href="support.html">技术支持 · Support</a>
    <a href="privacy.html">隐私政策 · Privacy</a>
  </nav>
</main>
</body>
</html>
